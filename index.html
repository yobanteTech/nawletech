<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- ============================= -->
    <!-- PRIMARY SEO -->
    <!-- ============================= -->

    <title>
      Nawle Tech Services et Conseil en Informatique
    </title>

    <meta
      name="description"
      content="Nawle Tech est votre partenaire en digitalisation au Sénégal et à l’international. Services informatiques, conseil, développement web et mobile, logiciels sur mesure et solutions digitales."
    />

    <meta
      name="author"
      content="Nawle Tech"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://nawletech.com/"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#0F3D5C"
    />

    <!-- ============================= -->
    <!-- FAVICON -->
    <!-- ============================= -->

    <link
      rel="icon"
      type="image/png"
      href="/nawletech-icon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/nawletech-icon.png"
    />

    <!-- ============================= -->
    <!-- OPEN GRAPH -->
    <!-- ============================= -->

    <meta
      property="og:locale"
      content="fr_FR"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Nawle Tech"
    />

    <meta
      property="og:title"
      content="Nawle Tech | Services et Conseil en Informatique"
    />

    <meta
      property="og:description"
      content="Votre partenaire en digitalisation au Sénégal et à l’international. Développement web et mobile, logiciels sur mesure, conseil informatique et solutions digitales."
    />

    <meta
      property="og:url"
      content="https://nawletech.com/"
    />

    <meta
      property="og:image"
      content="https://nawletech.com/nawletech-og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Nawle Tech - Services et Conseil en Informatique"
    />

    <!-- ============================= -->
    <!-- TWITTER / X -->
    <!-- ============================= -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Nawle Tech | Services et Conseil en Informatique"
    />

    <meta
      name="twitter:description"
      content="Votre partenaire en digitalisation au Sénégal et à l’international."
    />

    <meta
      name="twitter:image"
      content="https://nawletech.com/nawletech-og-image.png"
    />

    <!-- ============================= -->
    <!-- PERFORMANCE -->
    <!-- ============================= -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="dns-prefetch"
      href="//fonts.googleapis.com"
    />

    <link
      rel="dns-prefetch"
      href="//fonts.gstatic.com"
    />

    <!-- ============================= -->
    <!-- FONTS -->
    <!-- ============================= -->

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- ============================= -->
    <!-- STRUCTURED DATA : ORGANIZATION -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://nawletech.com/#organization",

        "name": "Nawle Tech",

        "url": "https://nawletech.com/",

        "logo": {
          "@type": "ImageObject",
          "url": "https://nawletech.com/nawletech-icon.png"
        },

        "description": "Nawle Tech propose des services et du conseil en informatique et accompagne les entreprises dans leur transformation digitale au Sénégal et à l'international.",

        "slogan": "Votre partenaire en digitalisation",

        "areaServed": [
          {
            "@type": "Country",
            "name": "Sénégal"
          },
          {
            "@type": "Place",
            "name": "International"
          }
        ],

        "knowsAbout": [
          "Services informatiques",
          "Conseil en informatique",
          "Digitalisation",
          "Transformation digitale",
          "Développement web",
          "Développement mobile",
          "Logiciels sur mesure",
          "Applications web",
          "Applications mobiles",
          "Solutions digitales",
          "Automatisation des processus",
          "Cloud",
          "Cybersécurité"
        ]
      }
    </script>

    <!-- STRUCTURED DATA : WEBSITE -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://nawletech.com/#website",

        "name": "Nawle Tech",

        "url": "https://nawletech.com/",

        "description": "Nawle Tech - Services et Conseil en Informatique",

        "publisher": {
          "@id": "https://nawletech.com/#organization"
        },

        "inLanguage": "fr"
      }
    </script>

    <!-- ============================= -->
    <!-- STRUCTURED DATA : PROFESSIONAL SERVICE -->
    <!-- ============================= -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",

        "name": "Nawle Tech",

        "url": "https://nawletech.com/",

        "description": "Services et conseil en informatique, développement de solutions digitales et accompagnement à la transformation numérique.",

        "provider": {
          "@id": "https://nawletech.com/#organization"
        },

        "areaServed": [
          {
            "@type": "Country",
            "name": "Sénégal"
          },
          {
            "@type": "Place",
            "name": "International"
          }
        ],

        "serviceType": [
          "Conseil en informatique",
          "Développement web",
          "Développement mobile",
          "Développement logiciel",
          "Digitalisation",
          "Transformation digitale",
          "Automatisation",
          "Solutions digitales"
        ]
      }
    </script>

    <div id="root"></div>

    <!-- React / Vite -->
    <script
